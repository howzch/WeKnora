name: Release Lite Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true

concurrency:
  group: release-lite-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── 1. Build frontend once, share as artifact (includes Wails bindings) ──
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Generate Wails bindings
        run: |
          export EDITION=lite
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          export CGO_ENABLED=1
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          cd cmd/desktop
          wails generate module

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          tar -czf ../frontend-dist.tar.gz dist/ src/wailsjs/

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist.tar.gz
          retention-days: 1

  # ── 2. Build Desktop APP for Windows only ──
  build-desktop-app:
    needs: build-frontend
    runs-on: windows-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Extract frontend directories
        shell: bash
        run: |
          mkdir -p frontend
          tar -xzf frontend-dist.tar.gz -C frontend/

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Prepare SQLite headers (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          HEADER_DIR="${GITHUB_WORKSPACE}/_sqlite_headers"
          mkdir -p "${HEADER_DIR}"
          curl -sL "https://raw.githubusercontent.com/mattn/go-sqlite3/v1.14.22/sqlite3-binding.h" -o "${HEADER_DIR}/sqlite3.h"
          curl -sL "https://raw.githubusercontent.com/mattn/go-sqlite3/v1.14.22/sqlite3ext.h" -o "${HEADER_DIR}/sqlite3ext.h"
          echo "SQLITE_HEADER_DIR=${HEADER_DIR}" >> $GITHUB_ENV

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build desktop app
        shell: bash
        run: |
          export EDITION=lite
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          eval "$(./scripts/get_version.sh env)"
          LDFLAGS="$(./scripts/get_version.sh ldflags) -X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'"
          export CGO_CFLAGS="-Wno-deprecated-declarations ${SQLITE_HEADER_DIR:+-I${SQLITE_HEADER_DIR}}"

          BUILD_TAGS="sqlite_fts5"
          OUT_NAME="WeKnora Lite.exe"

          cd cmd/desktop
          wails build -clean -skipbindings -s \
            -tags "${BUILD_TAGS}" \
            -platform "windows/amd64" \
            -ldflags="${LDFLAGS}" \
            -o "${OUT_NAME}"

      - name: Install NSIS (Windows)
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Package Windows app
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          INST_DIR="nsis_staging"
          mkdir -p "${INST_DIR}/config" "${INST_DIR}/migrations/sqlite" "${INST_DIR}/web" "${INST_DIR}/jieba_dict"

          cp "cmd/desktop/build/bin/WeKnora Lite.exe" "${INST_DIR}/"
          if [ -f .env.lite.example ]; then
            cp .env.lite.example "${INST_DIR}/.env"
          fi
          if [ -d config ]; then
            cp -r config/* "${INST_DIR}/config/"
          fi
          if [ -d migrations/sqlite ]; then
            cp -r migrations/sqlite/* "${INST_DIR}/migrations/sqlite/"
          fi
          if [ -d frontend/dist ]; then
            cp -r frontend/dist/* "${INST_DIR}/web/"
          fi
          JIEBA_VER=$(go list -m -f "{{.Version}}" github.com/yanyiwu/gojieba 2>/dev/null || grep gojieba go.mod | awk "{print \$2}")
          echo "Detected gojieba version: ${JIEBA_VER}"
          JIEBA_SRC="$(go env GOMODCACHE)/github.com/yanyiwu/gojieba@${JIEBA_VER}/deps/cppjieba/dict"
          if [ -d "${JIEBA_SRC}" ]; then
            cp "${JIEBA_SRC}"/{jieba.dict.utf8,hmm_model.utf8,user.dict.utf8,idf.utf8,stop_words.utf8} "${INST_DIR}/jieba_dict/"
          fi
          # Hard check: jieba dictionaries are required for Chinese tokenization
          JIEBA_COUNT=$(ls -1 "${INST_DIR}/jieba_dict/" 2>/dev/null | wc -l)
          echo "jieba_dict file count: ${JIEBA_COUNT}"
          if [ "${JIEBA_COUNT}" -lt 5 ]; then
            echo "::error::jieba_dict incomplete (${JIEBA_COUNT}/5 files). Expected: jieba.dict.utf8 hmm_model.utf8 user.dict.utf8 idf.utf8 stop_words.utf8 from ${JIEBA_SRC}"
            ls -la "$(go env GOMODCACHE)/github.com/yanyiwu/" 2>/dev/null || true
            exit 1
          fi

          OUTNAME="WeKnora-Lite-App_${VERSION}_windows_amd64_setup.exe"

          WIN_INST_DIR="$(cygpath -wa "${INST_DIR}")"
          WIN_OUTFILE="$(cygpath -wa .)\\${OUTNAME}"
          WIN_SCRIPT="$(cygpath -wa scripts/windows-installer.nsi)"

          makensis -DVERSION="${VERSION}" \
            "-DINST_DIR=${WIN_INST_DIR}" \
            "-DOUTFILE=${WIN_OUTFILE}" \
            "${WIN_SCRIPT}"

          sha256sum "${OUTNAME}" > "${OUTNAME}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-amd64
          path: |
            WeKnora-Lite-App_*_setup.exe
            WeKnora-Lite-App_*_setup.exe.sha256
          retention-days: 7